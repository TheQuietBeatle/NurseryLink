$kind: http-request
name: Health Check - GET /
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Body says Hello World!', function () {
          pm.expect(pm.response.text()).to.eql('Hello World!');
      });
    language: text/javascript
order: 1000
