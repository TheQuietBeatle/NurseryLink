<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temperature Record - NurseryLink</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#8d4b00",
                        "surface": "#fcf9f8",
                        "primary-fixed-dim": "#91d2d4",
                        "on-secondary-fixed": "#1a1c1a",
                        "on-surface-variant": "#3f4849",
                        "on-primary-fixed-variant": "#004f51",
                        "secondary-fixed": "#e3e2e0",
                        "primary-container": "#3d7e80",
                        "tertiary-fixed-dim": "#ffb77d",
                        "inverse-primary": "#91d2d4",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "outline": "#6f7979",
                        "tertiary-container": "#b15f00",
                        "on-secondary-fixed-variant": "#464745",
                        "surface-bright": "#fcf9f8",
                        "on-surface": "#1b1c1c",
                        "error-container": "#ffdad6",
                        "primary": "#1f6567",
                        "inverse-surface": "#303030",
                        "on-secondary-container": "#626361",
                        "primary-fixed": "#aceef0",
                        "background": "#fcf9f8",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdcc3",
                        "inverse-on-surface": "#f3f0f0",
                        "secondary-fixed-dim": "#c7c6c4",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed": "#2f1500",
                        "on-primary-fixed": "#002021",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "outline-variant": "#bfc8c8",
                        "secondary": "#5e5f5d",
                        "surface-container-low": "#f6f3f2",
                        "surface-variant": "#e4e2e1",
                        "surface-dim": "#dcd9d9",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#e0e0dd",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-background": "#1b1c1c",
                        "on-primary-container": "#f2ffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#23686a",
                        "surface-container-highest": "#e4e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "md": "16px",
                        "xl": "48px",
                        "gutter": "20px",
                        "xs": "4px",
                        "container-max": "1200px",
                        "lg": "24px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["\"Source Sans 3\""],
                        "headline-md": ["\"Source Sans 3\""],
                        "headline-lg": ["\"Source Sans 3\""],
                        "body-md": ["\"Source Sans 3\""],
                        "label-sm": ["\"Source Sans 3\""],
                        "display": ["\"Source Sans 3\""],
                        "label-md": ["\"Source Sans 3\""],
                        "body-lg": ["\"Source Sans 3\""]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-md md:p-lg">
<!-- Main Container -->
<main class="w-full max-w-[600px] bg-surface rounded-xl border border-outline-variant p-lg md:p-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] flex flex-col gap-lg">
<!-- Header -->
<header class="flex items-center justify-between border-b border-outline-variant pb-sm">
<div>
<h1 class="text-headline-md font-headline-md text-primary">Record Temperature</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-xs">Recording for Emma Thompson</p>
</div>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<!-- Temperature Input Area -->
<section class="flex flex-col items-center justify-center py-lg gap-lg">
<div class="flex items-center justify-center gap-xl w-full">
<!-- Minus Button -->
<button aria-label="Decrease temperature" class="w-16 h-16 rounded-full border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-headline-lg font-headline-lg" style="font-variation-settings: 'FILL' 0;">remove</span>
</button>
<!-- Display -->
<div class="flex flex-col items-center">
<span class="text-display font-display text-error">38.4°C</span>
<span class="text-label-sm font-label-sm text-on-surface-variant mt-xs">Accepted range: 34.0°C - 42.0°C</span>
</div>
<!-- Plus Button -->
<button aria-label="Increase temperature" class="w-16 h-16 rounded-full border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-headline-lg font-headline-lg" style="font-variation-settings: 'FILL' 0;">add</span>
</button>
</div>
<!-- Warning Banner -->
<div class="w-full bg-error-container text-on-error-container p-sm rounded-lg flex items-start gap-sm mt-md">
<span class="material-symbols-outlined text-on-error-container mt-xs" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="text-body-md font-body-md">High temperature detected. All linked parents will be notified automatically upon saving.</p>
</div>
</section>
<!-- Notes Field -->
<section class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="temperature-notes">Notes (Optional)</label>
<textarea class="w-full bg-surface-container-low border-b border-outline-variant p-sm text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary resize-none rounded-t-DEFAULT" id="temperature-notes" placeholder="Add any relevant observations..." rows="4"></textarea>
</section>
<!-- Action Button -->
<footer class="mt-md">
<button class="w-full bg-primary text-on-primary rounded-[10px] py-md text-headline-md font-headline-md hover:bg-surface-tint transition-colors active:scale-[0.98]">
                Confirm Record
            </button>
</footer>
</main>
</body></html>
